            var btn = skipBtn.closest('button') || skipBtn.closest('.v-btn') || skipBtn;
            try {
                btn.removeAttribute('disabled');
                btn.disabled = false;
                btn.classList.remove('v-btn--disabled', 'disabled');
                btn.removeAttribute('aria-disabled');
                btn.style.pointerEvents = 'auto';
            } catch(e) {}

            var rect = btn.getBoundingClientRect();
            var cx = rect.left + (rect.width > 0 ? rect.width / 2 : 10);
            var cy = rect.top + (rect.height > 0 ? rect.height / 2 : 10);
            var opts = { bubbles: true, cancelable: true, composed: true, view: window, clientX: cx, clientY: cy, button: 0 };
            var targets = [btn, btn.parentElement, btn.querySelector('.v-btn__content')].filter(Boolean);

            for (var t = 0; t < targets.length; t++) {
                var el = targets[t];
                ['mouseover', 'mouseenter', 'pointerover', 'pointerenter', 'mousedown', 'pointerdown'].forEach(function(evt) {
                    try { el.dispatchEvent(new PointerEvent(evt, opts)); } catch(e) {}
                    try { el.dispatchEvent(new MouseEvent(evt, opts)); } catch(e) {}
                });
                ['mouseup', 'pointerup', 'click'].forEach(function(evt) {
                    try { el.dispatchEvent(new PointerEvent(evt, opts)); } catch(e) {}
                    try { el.dispatchEvent(new MouseEvent(evt, opts)); } catch(e) {}
                });
                try { el.click(); } catch(e) {}
            }
            console.log('[CT Auto-Skip] ✅ Successfully clicked yellow Skip button for Panel ' + pId + ', Part ' + partId + '!');
        } else {
            console.warn('[CT Auto-Skip] ❌ Yellow Skip button not found for Part ' + partId);
        }
    }

    window._handleDosAutoSkip = function(iframeId, eventSource) {
        var allWebviews = Array.from(document.querySelectorAll('iframe[data-is-webview="true"], iframe.ct-webview-frame, webview'));
        if (allWebviews.length === 0) allWebviews = Array.from(document.querySelectorAll('iframe'));

        var targetWv = null;
        if (iframeId) {
            targetWv = allWebviews.find(function(el) {
                return el.name === iframeId ||
                       (el.dataset && el.dataset.frameId === iframeId) ||
                       el._currentFrameId === iframeId ||
                       (el.src && el.src.indexOf('id=' + iframeId) !== -1);
            });
        }
        if (!targetWv && eventSource && eventSource !== window) {
            var curr = eventSource;
            try {
                while (curr && curr.parent && curr.parent !== window && curr.parent !== curr) {
                    curr = curr.parent;
                }
            } catch(e) {}
            targetWv = allWebviews.find(function(el) {
                try { return el.contentWindow === curr; } catch(e) { return false; }
            });
        }

        var partId = targetWv ? (targetWv.dataset.partId || 1) : 1;
        triggerAutoSkip(targetWv, partId);
    };

    function checkDocForDos(doc) {
        if (!doc) return false;
        try {
            if (doc.querySelector('.rc-doscaptcha, .rc-doscaptcha-header, .rc-doscaptcha-body, .rc-doscaptcha-footer')) {
                return true;
            }
            var elList = doc.querySelectorAll('h3, .rc-doscaptcha-header-text, .rc-doscaptcha-body-text, p, div');
            for (var i = 0; i < elList.length; i++) {
                var txt = (elList[i].innerText || elList[i].textContent || '').toLowerCase();
                if (txt.indexOf('try again later') !== -1 ||
                    txt.indexOf('automated queries') !== -1 ||
                    (txt.indexOf('try again') !== -1 && txt.indexOf('computer or network') !== -1)) {
                    return true;
                }
            }
        } catch(e) {}
        return false;
    }

    // Background interval check inspecting webview contents every 700ms
    setInterval(function scanWebviewsForDos() {
        var allWebviews = Array.from(document.querySelectorAll('iframe[data-is-webview="true"], iframe.ct-webview-frame, webview'));
        allWebviews.forEach(function(wv) {
            try {
                var doc = wv.contentDocument || (wv.contentWindow && wv.contentWindow.document);
                if (!doc) return;

                if (checkDocForDos(doc)) {
                    var partId = wv.dataset.partId || 1;
                    triggerAutoSkip(wv, partId);
                    return;
                }

                // Check nested sub-iframes inside the webview (e.g. bframe, anchor)
                var subFrames = Array.from(doc.querySelectorAll('iframe'));
                for (var k = 0; k < subFrames.length; k++) {
                    try {
                        var subDoc = subFrames[k].contentDocument || (subFrames[k].contentWindow && subFrames[k].contentWindow.document);
                        if (subDoc) {
                            if (checkDocForDos(subDoc)) {
                                var pId = wv.dataset.partId || 1;
                                triggerAutoSkip(wv, pId);
                                return;
                            }
                            // Auto-switch to audio if mistakenly flipped to image/view mode
                            var audioBtn = subDoc.querySelector('#recaptcha-audio-button, button.rc-button-audio');
                            if (audioBtn && !subDoc.querySelector('#audio-response, audio#audio-source')) {
                                try { audioBtn.click(); } catch(e) {}
                            }
                            var imgBtn = subDoc.querySelector('#recaptcha-image-button, button.rc-button-image');
                            if (imgBtn && !imgBtn._ct_dimmed) {
                                imgBtn._ct_dimmed = true;
                                imgBtn.style.opacity = '0.35';
                                imgBtn.style.cursor = 'not-allowed';
                            }
                        }
                    } catch(e) {}
                }
            } catch(err) {}
        });
    }, 700);
})();
</script>
<script>
// --- AUTO-CLICK START ICON ON TIMEOUT (10s Delay, Strictly Scoped Per Part) ---
(function initPartTimeoutAutoRestart() {
    console.log('[CT Panel Auto-Restart] Initialized per-part timeout auto-restart monitor.');

    var activeTimers = new Map();

    function findPartContainer(timeoutEl) {
        if (!timeoutEl) return null;
        var curr = timeoutEl;
        while (curr && curr !== document.body && curr !== document.documentElement) {
            var playIcons = curr.querySelectorAll('.mdi-play-circle');
            if (playIcons.length === 1) {
                return { container: curr, playIcon: playIcons[0] };
            }
            curr = curr.parentElement;
        }
        return null;
    }

    function isElementTimedOut(container) {
        if (!container) return false;
        var hasClock = container.querySelector('.mdi-clock-alert-outline');
        if (hasClock) return true;
        var headings = Array.from(container.querySelectorAll('h2'));
        return headings.some(function(h) {
            return (h.innerText || h.textContent || '').trim().toLowerCase() === 'timed out';
        });
    }

    function checkTimeouts() {
        var timeoutIcons = Array.from(document.querySelectorAll('.mdi-clock-alert-outline'));
        var headings = Array.from(document.querySelectorAll('h2')).filter(function(h) {
            return (h.innerText || h.textContent || '').trim().toLowerCase() === 'timed out';
        });
        var allTimeouts = timeoutIcons.concat(headings);
        var handledContainers = new Set();

        allTimeouts.forEach(function(el) {
            var scope = findPartContainer(el);
            if (!scope || handledContainers.has(scope.container)) return;
            handledContainers.add(scope.container);

            var partContainer = scope.container;
            var playIcon = scope.playIcon;

            if (activeTimers.has(partContainer)) return;

            var playBtn = playIcon.closest('button') || playIcon.parentElement;
            if (!playBtn) return;

            console.log('[CT Panel Auto-Restart] ⏳ Timed out detected in part slot! Waiting 10 seconds before auto-clicking start icon...');

            var alertBox = el.closest('.text-center') || el.parentElement;
            var label = null;
            if (alertBox) {
                label = alertBox.querySelector('.ct-timeout-autostart-label');
                if (!label) {
                    label = document.createElement('div');
                    label.className = 'ct-timeout-autostart-label';
                    label.style.cssText = 'color:#00e676; font-size:15px; font-weight:bold; margin-top:10px; text-align:center; animation:pulse 1s infinite;';
                    alertBox.appendChild(label);
                }
            }

            var secondsLeft = 10;
            if (label) label.textContent = 'Auto-starting in ' + secondsLeft + 's...';

            var intervalId = setInterval(function() {
                secondsLeft--;
                if (label) label.textContent = 'Auto-starting in ' + secondsLeft + 's...';

                if (!isElementTimedOut(partContainer)) {
                    console.log('[CT Panel Auto-Restart] Part is no longer timed out. Clearing countdown.');
                    clearInterval(intervalId);
                    activeTimers.delete(partContainer);
                    if (label && label.parentElement) label.remove();
                    return;
                }

                if (secondsLeft <= 0) {
                    clearInterval(intervalId);
                    activeTimers.delete(partContainer);
                    if (label && label.parentElement) label.remove();

                    console.log('[CT Panel Auto-Restart] 🚀 10 seconds reached! Auto-clicking START icon for this specific part...');
                    try {
                        playBtn.click();
                        playBtn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
                    } catch(err) {
                        console.error('[CT Panel Auto-Restart] Error clicking start button:', err);
                    }
                }
            }, 1000);

            activeTimers.set(partContainer, intervalId);
        });
    }

    setInterval(checkTimeouts, 1000);
})();
</script>
